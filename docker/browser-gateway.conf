# Optional gateway for showing the lab in a real browser (compose profile "browser").
# TLS is passed through untouched: the browser verifies the origin's own certificate.
# Runs as root only because runs/<id>/public is a 0700 host directory.
user root;
worker_processes 1;
error_log /dev/stderr notice;
events {}

stream {
    log_format gateway '$remote_addr -> $upstream_addr status=$status bytes=$bytes_sent';
    access_log /dev/stdout gateway;
    # The lab resolver decides the upstream, so the browser follows the DNS hijack and recovery.
    resolver dns valid=1s ipv6=off;
    server {
        listen 443;
        set $origin login.payroll.test:443;
        proxy_pass $origin;
    }
}

http {
    log_format crl '$remote_addr $host "$request" status=$status';
    access_log /dev/stdout crl;
    server {
        listen 80;
        server_name crl.payroll.test;
        root /public;
        default_type application/pkix-crl;
        add_header Cache-Control "no-store" always;
        location ~ ^/[a-z-]+\.crl$ {}
        # Public root certificate, for importing into the presenter's trust store.
        location = /root.crt { default_type application/x-x509-ca-cert; }
        location / { return 404; }
    }
    server {
        listen 80;
        server_name ocsp.payroll.test;
        # Docker's embedded DNS: resolve the responder per request so a restarted ocsp container is found.
        resolver 127.0.0.11 valid=1s ipv6=off;
        add_header Cache-Control "no-store" always;
        location / {
            set $ocsp_responder ocsp:80;
            # Chrome sends GET /<url-encoded base64 request>; pass it byte-for-byte.
            proxy_pass http://$ocsp_responder$request_uri;
        }
    }
}
