log_format lab '$remote_addr "$request" status=$status tls=$ssl_protocol';
access_log /dev/stdout lab;
server {
    listen 443 ssl;
    server_name login.payroll.test;
    ssl_protocols TLSv1.3;
    ssl_certificate /certs/chain.pem;
    ssl_certificate_key /certs/server.key;
    add_header X-Lab-Origin "${LAB_ORIGIN}" always;
    location / {
        default_type text/plain;
        return 200 "${LAB_BODY}\n";
    }
}
