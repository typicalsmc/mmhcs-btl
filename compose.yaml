services:
  ca:
    image: pki-lab-tools:local
    build:
      context: .
      dockerfile: docker/tools.Dockerfile
    network_mode: none
    command: [python, /lab/pki.py, init]
    volumes:
      - type: bind
        source: ${LAB_RUN_DIR}/ca-private
        target: /ca-private
        bind: {create_host_path: false}
      - type: bind
        source: ${LAB_RUN_DIR}/legitimate
        target: /legitimate
        bind: {create_host_path: false}
      - type: bind
        source: ${LAB_RUN_DIR}/leak
        target: /leak
        bind: {create_host_path: false}
      - type: bind
        source: ${LAB_RUN_DIR}/public
        target: /public
        bind: {create_host_path: false}
      - type: bind
        source: ${LAB_RUN_DIR}/ocsp
        target: /ocsp
        bind: {create_host_path: false}
  legitimate:
    image: nginx:1.28-alpine
    networks: [lab]
    environment:
      LAB_ORIGIN: legitimate
      LAB_BODY: LEGITIMATE PAYROLL LAB
      NGINX_ENVSUBST_FILTER: '^(LAB_ORIGIN|LAB_BODY)$$'
    volumes:
      - type: bind
        source: ${LAB_RUN_DIR}/legitimate
        target: /certs
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./docker/nginx.conf
        target: /etc/nginx/templates/default.conf.template
        read_only: true
        bind: {create_host_path: false}
  attacker:
    image: pki-lab-attacker:local
    build:
      context: .
      dockerfile: docker/attacker.Dockerfile
    networks: [lab]
    environment:
      LAB_ORIGIN: attacker
      LAB_BODY: ATTACKER PAYROLL LAB
      NGINX_ENVSUBST_FILTER: '^(LAB_ORIGIN|LAB_BODY)$$'
    volumes:
      - type: bind
        source: ${LAB_RUN_DIR}/leak
        target: /leak
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${LAB_RUN_DIR}/attacker
        target: /certs
        bind: {create_host_path: false}
  dns:
    image: pki-lab-tools:local
    networks: [lab]
    command: [dnsmasq, --conf-file=/lab/dnsmasq.conf]
    volumes:
      - type: bind
        source: ${LAB_RUN_DIR}/dns
        target: /dns
        read_only: true
        bind: {create_host_path: false}
  ocsp:
    image: pki-lab-tools:local
    networks: [lab]
    # openssl ocsp as PID 1 would ignore SIGTERM; tini lets stop/restart take effect at once.
    init: true
    command: [openssl, ocsp, -port, '80', -index, /ocsp/index.txt, -CA, /ocsp/root.crt,
              -rsigner, /ocsp/responder.crt, -rkey, /ocsp/responder.key, -nmin, '5', -timeout, '5', -ignore_err]
    volumes:
      - type: bind
        source: ${LAB_RUN_DIR}/ocsp
        target: /ocsp
        read_only: true
        bind: {create_host_path: false}
  victim:
    image: pki-lab-tools:local
    networks: [lab]
    command: [python, /lab/client.py]
    volumes:
      - type: bind
        source: ${LAB_RUN_DIR}/public
        target: /trust
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${LAB_RUN_DIR}/dns/resolv.conf
        target: /etc/resolv.conf
        read_only: true
        bind: {create_host_path: false}
  browser:
    # Opt-in only (profile "browser"); the only service with published ports.
    image: nginx:1.28-alpine
    profiles: [browser]
    networks: [lab, edge]
    ports:
      - ${LAB_BROWSER_IP:-127.0.0.1}:443:443
      - ${LAB_BROWSER_IP:-127.0.0.1}:80:80
    volumes:
      - type: bind
        source: ${LAB_RUN_DIR}/public
        target: /public
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./docker/browser-gateway.conf
        target: /etc/nginx/nginx.conf
        read_only: true
        bind: {create_host_path: false}
networks:
  lab:
    internal: true
  edge: {}
